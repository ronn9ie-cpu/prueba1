<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Para mi amorcita Angie - Una dedicatoria de amor interactiva y moderna.">
  <title>Para Angie ❤️ | Te amo mucho</title>
  
  <!-- Tipografías modernas y elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas de fondo para partículas y corazones flotantes -->
  <canvas id="starsAndHeartsCanvas" aria-hidden="true"></canvas>

  <!-- Luces ambientales de fondo -->
  <div class="ambient-glow glow-pink" aria-hidden="true"></div>
  <div class="ambient-glow glow-purple" aria-hidden="true"></div>
  <div class="ambient-glow glow-dark" aria-hidden="true"></div>

  <!-- Botón de música ambiental romántica en la esquina -->
  <button id="audioToggleBtn" class="audio-toggle-btn" title="Activar música de cajita de cristal" aria-label="Reproducir música romántica">
    <span class="music-icon">🎵</span>
    <span class="music-text">Música de amor</span>
    <span class="music-wave" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </button>

  <main class="page-container">
    <!-- Tarjeta romántica principal con efecto tilt y reflejo -->
    <article class="romantic-card" id="romanticCard">
      <div class="card-glass-shine" id="cardShine"></div>

      <!-- Marco de neón con imagen animada -->
      <div class="neon-frame-wrapper" id="frameWrapper">
        <div class="neon-halo"></div>
        <div class="neon-frame">
          <img 
            src="pareja.jfif" 
            alt="Nosotros dos juntos, abrazados con amor" 
            class="couple-image"
            id="coupleImg"
            loading="eager"
          >
          <div class="image-overlay-glow"></div>
        </div>
        
        <!-- Insignia flotante de corazón -->
        <div class="floating-heart-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="svg-heart">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>

      <!-- Título principal animado -->
      <header class="title-container">
        <h1 class="main-title" id="typewriterTitle" data-text="Te amo mucho mi amorcita Angie">
          <!-- El texto se escribe o revela con animación dinámica -->
        </h1>
        <div class="sparkle-line" aria-hidden="true">
          <span class="star-sparkle">✦</span>
        </div>
      </header>

      <!-- Mensaje secundario poético -->
      <p class="love-subtitle" id="loveSubtitle">
        Tú iluminas cada uno de mis días, eres mi razón favorita para sonreír.
      </p>

      <!-- Botón de interactividad romántica -->
      <div class="card-actions">
        <button type="button" class="btn-love-burst" id="loveBurstBtn">
          <span class="btn-icon">💖</span>
          <span class="btn-text">Enviarte un abrazo</span>
        </button>
      </div>

      <!-- Contador de amor o mensaje tierno -->
      <footer class="card-footer">
        <span class="footer-tag">Juntos por siempre &bull; Siempre en mi corazón</span>
      </footer>
    </article>
  </main>

  <!-- Contenedor para corazones que brotan al hacer clic -->
  <div id="heartBurstContainer" class="heart-burst-container" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
